<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Huevos Don Renato - App</title>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para los íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- React para la interactividad -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-color: #FFF8F0; /* Blanco muy cálido */
            --brand-amber: #EA580C; /* Naranja fuerte/Óxido (Instagram vibe) */
            --brand-amber-light: #FFEDD5;
            --text-dark: #431407; /* Café muy oscuro */
        }
        body {
            background-color: #F3F4F6; /* Fondo gris para destacar el móvil en desktop */
            color: var(--text-dark);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        /* Contenedor tipo móvil */
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .safe-pb { padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 90px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 0px); }
        
        ::-webkit-scrollbar { display: none; }
        
        .img-overlay {
            background: linear-gradient(to top, rgba(67, 20, 7, 0.8) 0%, rgba(67, 20, 7, 0) 100%);
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex flex-col justify-center items-center h-screen bg-[#FFF8F0] text-[#EA580C]">
            <i class="fa-solid fa-egg fa-bounce fa-3x mb-4"></i>
            <h2 class="font-black text-xl">Cargando Don Renato...</h2>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.dbUtils = {
            init: async () => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'don-renato-pro-' + Math.random().toString(36).substring(7);
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo-project" };
                
                try {
                    const app = initializeApp(config);
                    const auth = getAuth(app);
                    const db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    window.fsDb = db;
                    window.fsBasePath = `artifacts/${appId}/public/data`;
                    return true;
                } catch (error) {
                    console.error("Error Firebase:", error);
                    return false;
                }
            },
            onSnapshot, doc, collection, setDoc, getDoc, updateDoc, addDoc, query
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Catálogo con fotos referenciales estilo Instagram
        const PRODUCTS = [
            { id: 'bandeja_extra_color', name: 'Bandeja Extra Color', price: 7000, type: 'bandeja', qtyLabel: '30 u.', img: 'https://images.unsplash.com/photo-1598965675045-45c5e72c7d05?auto=format&fit=crop&w=300&q=80' },
            { id: 'bandeja_primera_color', name: 'Bandeja Primera Color', price: 6000, type: 'bandeja', qtyLabel: '30 u.', img: 'https://images.unsplash.com/photo-1501430654243-c934cec2e1c0?auto=format&fit=crop&w=300&q=80' },
            { id: 'bandeja_extra_blanco', name: 'Bandeja Extra Blanco', price: 7000, type: 'bandeja', qtyLabel: '30 u.', img: 'https://images.unsplash.com/photo-1587486913049-53fc88980cfc?auto=format&fit=crop&w=300&q=80' },
            { id: 'caja_extra_color', name: 'Caja Extra de Color', price: 34000, type: 'caja', qtyLabel: '180 u.', img: 'https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=300&q=80' },
            { id: 'caja_primera_color', name: 'Caja Primera Color', price: 32000, type: 'caja', qtyLabel: '180 u.', img: 'https://images.unsplash.com/photo-1582337409386-896f60ce3916?auto=format&fit=crop&w=300&q=80' },
            { id: 'caja_extra_blanco', name: 'Caja Extra Blanco', price: 34000, type: 'caja', qtyLabel: '180 u.', img: 'https://images.unsplash.com/photo-1518569656558-1fdc5bf32152?auto=format&fit=crop&w=300&q=80' },
            { id: 'queso_mantecoso', name: 'Queso Río Cruces', price: 11990, type: 'queso', qtyLabel: '1 Kg', img: 'https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?auto=format&fit=crop&w=300&q=80' },
        ];

        // Utilidad para obtener la fecha local en formato YYYY-MM-DD
        function getLocalYYYYMMDD(isoString = null) {
            const d = isoString ? new Date(isoString) : new Date();
            const tzOffset = d.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(d - tzOffset)).toISOString().slice(0, -1);
            return localISOTime.split('T')[0];
        }

        function App() {
            const [isReady, setIsReady] = useState(false);
            const [activeTab, setActiveTab] = useState('ruta'); // tabs: dashboard, ruta, inventario, historial
            const [showNewOrder, setShowNewOrder] = useState(false);
            
            // Estado global sincronizado
            const [orders, setOrders] = useState([]);
            const [inventory, setInventory] = useState({});

            useEffect(() => {
                let unsubOrders = () => {};
                let unsubInventory = () => {};

                const setupDatabase = async () => {
                    while(!window.dbUtils) { await new Promise(r => setTimeout(r, 100)); }
                    const success = await window.dbUtils.init();
                    if (!success) { setIsReady(true); return; }

                    const { onSnapshot, collection, doc, query } = window.dbUtils;

                    // Escuchar Pedidos (Todas las fechas)
                    const ordersQuery = query(collection(window.fsDb, `${window.fsBasePath}/orders`));
                    unsubOrders = onSnapshot(ordersQuery, (snapshot) => {
                        const loadedOrders = [];
                        snapshot.forEach((doc) => loadedOrders.push({ id: doc.id, ...doc.data() }));
                        loadedOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                        setOrders(loadedOrders);
                    });

                    // Escuchar Inventario (Stock Móvil)
                    unsubInventory = onSnapshot(doc(window.fsDb, `${window.fsBasePath}/inventory`, 'stock'), (docSnap) => {
                        if (docSnap.exists()) setInventory(docSnap.data());
                        else setInventory({});
                    });

                    setIsReady(true);
                };
                setupDatabase();

                return () => { unsubOrders(); unsubInventory(); };
            }, []);

            const handleCreateOrder = async (orderData) => {
                if(!window.fsDb) return;
                const { addDoc, collection } = window.dbUtils;
                try {
                    await addDoc(collection(window.fsDb, `${window.fsBasePath}/orders`), {
                        ...orderData,
                        status: 'pendiente',
                        createdAt: new Date().toISOString()
                    });
                    setShowNewOrder(false);
                } catch (e) { console.error("Error guardar:", e); }
            };

            const handleDeliverOrder = async (order) => {
                if(!window.fsDb) return;
                const { updateDoc, doc, getDoc, setDoc } = window.dbUtils;
                try {
                    // Marcar como entregado con fecha actual (ISO)
                    await updateDoc(doc(window.fsDb, `${window.fsBasePath}/orders`, order.id), {
                        status: 'entregado',
                        deliveredAt: new Date().toISOString()
                    });

                    // Descontar inventario
                    const invRef = doc(window.fsDb, `${window.fsBasePath}/inventory`, 'stock');
                    const invSnap = await getDoc(invRef);
                    let currentInv = invSnap.exists() ? invSnap.data() : {};
                    
                    order.items.forEach(item => {
                        const currentQty = currentInv[item.id] || 0;
                        currentInv[item.id] = Math.max(0, currentQty - item.qty);
                    });
                    await setDoc(invRef, currentInv);
                } catch (e) { console.error("Error entregar:", e); }
            };

            const handleAddStock = async (productId, qty) => {
                if(!window.fsDb) return;
                const { getDoc, setDoc, doc } = window.dbUtils;
                try {
                    const invRef = doc(window.fsDb, `${window.fsBasePath}/inventory`, 'stock');
                    const invSnap = await getDoc(invRef);
                    let currentInv = invSnap.exists() ? invSnap.data() : {};
                    currentInv[productId] = (currentInv[productId] || 0) + qty;
                    await setDoc(invRef, currentInv);
                } catch (e) { console.error("Error stock:", e); }
            };

            if (!isReady) return null;

            return (
                <div className="mobile-container">
                    {/* Header estilo Marca */}
                    <header className="bg-gradient-to-r from-orange-600 to-amber-600 text-white p-4 safe-pt sticky top-0 z-10 shadow-md">
                        <div className="flex items-center gap-3">
                            <div className="bg-white text-orange-600 w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-inner border border-amber-200">
                                🐓
                            </div>
                            <div className="flex-1">
                                <h1 className="text-xl font-black uppercase tracking-tight leading-none">Don Renato</h1>
                                <p className="text-orange-100 text-[10px] font-bold uppercase tracking-widest mt-1">
                                    Calidad que se nota
                                </p>
                            </div>
                            <div className="bg-orange-700/50 px-2 py-1 rounded text-xs font-bold border border-orange-500/50 shadow-sm">
                                <i className="fa-solid fa-location-dot mr-1"></i> L.A.
                            </div>
                        </div>
                    </header>

                    {/* Contenedor Vistas */}
                    <main className="safe-pb h-full overflow-y-auto">
                        {activeTab === 'dashboard' && <DashboardView orders={orders} />}
                        {activeTab === 'ruta' && <RouteView orders={orders} onDeliver={handleDeliverOrder} onOpenNew={() => setShowNewOrder(true)} />}
                        {activeTab === 'inventario' && <InventoryView inventory={inventory} onAddStock={handleAddStock} />}
                        {activeTab === 'historial' && <HistoryView orders={orders} />}
                    </main>

                    {/* Modal */}
                    {showNewOrder && <NewOrderModal onClose={() => setShowNewOrder(false)} onSave={handleCreateOrder} />}

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-200 flex justify-around items-center pb-[env(safe-area-inset-bottom)] z-40 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                        {[
                            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Hoy' },
                            { id: 'ruta', icon: 'fa-truck-fast', label: 'Ruta' },
                            { id: 'inventario', icon: 'fa-boxes-stacked', label: 'Stock' },
                            { id: 'historial', icon: 'fa-calendar-days', label: 'Historial' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex-1 py-3 flex flex-col items-center gap-1 transition-colors ${activeTab === tab.id ? 'text-orange-600' : 'text-gray-400'}`}
                            >
                                <i className={`fa-solid ${tab.icon} text-xl ${activeTab === tab.id ? 'scale-110 mb-1' : 'mb-1'} transition-transform`}></i>
                                <span className="text-[10px] font-black uppercase tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        function HistoryView({ orders }) {
            const [selectedDate, setSelectedDate] = useState(getLocalYYYYMMDD()); // Por defecto: Hoy

            const stats = useMemo(() => {
                // Filtrar las órdenes que fueron entregadas EN la fecha seleccionada
                const deliveredOnDate = orders.filter(o => 
                    o.status === 'entregado' && 
                    o.deliveredAt && 
                    getLocalYYYYMMDD(o.deliveredAt) === selectedDate
                );

                const income = deliveredOnDate.reduce((sum, o) => sum + o.total, 0);
                
                // Calcular productos vendidos ese día
                const productsCount = {};
                deliveredOnDate.forEach(o => {
                    o.items.forEach(item => {
                        productsCount[item.id] = (productsCount[item.id] || 0) + item.qty;
                    });
                });

                return { deliveredOnDate, income, productsCount };
            }, [orders, selectedDate]);

            // Formatear fecha para el usuario
            const displayDate = new Date(selectedDate + "T12:00:00").toLocaleDateString('es-CL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            return (
                <div className="p-4 space-y-5">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-black text-[#431407]">Reportes</h2>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Seleccionar Fecha</label>
                        <input 
                            type="date" 
                            value={selectedDate}
                            onChange={(e) => setSelectedDate(e.target.value)}
                            className="w-full p-3 rounded-xl border border-gray-200 font-bold text-gray-800 bg-gray-50 focus:border-orange-500 focus:outline-none"
                        />
                    </div>

                    <div className="bg-[#431407] rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                        <i className="fa-solid fa-sack-dollar absolute -right-2 -bottom-2 text-7xl opacity-20 text-orange-400"></i>
                        <p className="font-bold text-orange-200 uppercase tracking-wider text-xs">Ventas del {displayDate.split(',')[0]}</p>
                        <p className="text-4xl font-black mt-2">${stats.income.toLocaleString('es-CL')}</p>
                        <p className="text-sm font-medium mt-1 text-gray-300">
                            <i className="fa-solid fa-check-circle mr-1 text-green-400"></i>
                            {stats.deliveredOnDate.length} pedidos completados
                        </p>
                    </div>

                    {Object.keys(stats.productsCount).length > 0 && (
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                            <h3 className="font-black text-gray-800 mb-3"><i className="fa-solid fa-basket-shopping mr-2 text-orange-500"></i>Productos Vendidos</h3>
                            <div className="space-y-3">
                                {PRODUCTS.map(p => {
                                    const qty = stats.productsCount[p.id];
                                    if (!qty) return null;
                                    return (
                                        <div key={p.id} className="flex items-center justify-between border-b border-gray-50 pb-2 last:border-0">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0">
                                                    <img src={p.img} alt={p.name} className="w-full h-full object-cover" />
                                                </div>
                                                <p className="font-bold text-gray-800 text-sm">{p.name}</p>
                                            </div>
                                            <span className="font-black text-orange-600 bg-orange-50 px-3 py-1 rounded-lg">{qty} {p.type === 'caja' ? 'cajas' : 'unid.'}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {stats.deliveredOnDate.length > 0 && (
                        <div>
                            <h3 className="font-black text-gray-800 mb-3 ml-1"><i className="fa-solid fa-list-ul mr-2 text-gray-400"></i>Detalle de Entregas</h3>
                            <div className="space-y-3">
                                {stats.deliveredOnDate.map(o => (
                                    <div key={o.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                        <div>
                                            <p className="font-bold text-gray-800">{o.customerName}</p>
                                            <p className="text-xs text-gray-400">{new Date(o.deliveredAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                        </div>
                                        <span className="font-black text-green-600">${o.total.toLocaleString('es-CL')}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function RouteView({ orders, onDeliver, onOpenNew }) {
            const pendingOrders = orders.filter(o => o.status === 'pendiente');

            const handleWhatsApp = (phone, name) => {
                const clean = phone.replace(/\D/g, '');
                if(!clean) return;
                const msg = encodeURIComponent(`Hola ${name}, somos Huevos Don Renato 🐓🥚. ¡Vamos en camino a su domicilio con su pedido!`);
                window.open(`https://wa.me/${clean}?text=${msg}`, '_blank');
            };

            return (
                <div className="p-4 space-y-4">
                    <div className="flex justify-between items-end mb-2">
                        <h2 className="text-2xl font-black text-[#431407]">Ruta Actual</h2>
                        <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded-full font-bold text-sm">
                            {pendingOrders.length} Pendientes
                        </span>
                    </div>

                    {pendingOrders.length === 0 ? (
                        <div className="text-center py-16 px-4 bg-white rounded-3xl border border-dashed border-gray-300">
                            <div className="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i className="fa-solid fa-check text-4xl text-green-600"></i>
                            </div>
                            <h3 className="text-xl font-black text-gray-800">¡Ruta limpia!</h3>
                            <p className="text-gray-500 mt-2 font-medium">No hay pedidos pendientes por entregar.</p>
                        </div>
                    ) : (
                        <div className="space-y-4 pb-10">
                            {pendingOrders.map(order => (
                                <div key={order.id} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-orange-500"></div>
                                    
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="font-black text-lg text-gray-900 leading-tight">{order.customerName}</h3>
                                            <p className="text-sm text-gray-600 mt-1 flex items-start gap-1">
                                                <i className="fa-solid fa-location-dot mt-0.5 text-orange-500"></i>
                                                <span className="font-medium">{order.address}</span>
                                            </p>
                                        </div>
                                        <div className="bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100">
                                            <span className="font-black text-lg text-orange-600">${order.total.toLocaleString('es-CL')}</span>
                                        </div>
                                    </div>

                                    <div className="mt-4 pt-4 border-t border-gray-100 space-y-2">
                                        {order.items.map((item, idx) => {
                                            const p = PRODUCTS.find(prod => prod.id === item.id);
                                            return (
                                                <div key={idx} className="flex items-center gap-2 text-sm font-bold text-gray-700">
                                                    <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-xs">{item.qty}x</span>
                                                    <span>{p ? p.name : item.id}</span>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="flex gap-3 mt-5">
                                        <button 
                                            onClick={() => handleWhatsApp(order.phone, order.customerName)}
                                            className="flex-1 bg-[#E8F5E9] text-[#2E7D32] py-3 rounded-xl font-bold flex items-center justify-center gap-2 active:bg-[#C8E6C9] transition-colors shadow-sm"
                                        >
                                            <i className="fa-brands fa-whatsapp text-xl"></i>
                                            Avisar
                                        </button>
                                        <button 
                                            onClick={() => onDeliver(order)}
                                            className="flex-[1.5] bg-green-600 text-white py-3 rounded-xl font-black shadow-md flex items-center justify-center gap-2 active:bg-green-700 transition-colors"
                                        >
                                            <i className="fa-solid fa-check-circle text-lg"></i>
                                            Entregado
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Botón FAB Gigante */}
                    <button 
                        onClick={onOpenNew}
                        className="fixed bottom-24 right-5 w-16 h-16 bg-orange-600 text-white rounded-full shadow-[0_4px_15px_rgba(234,88,12,0.5)] flex items-center justify-center text-2xl active:scale-90 transition-transform z-30"
                    >
                        <i className="fa-solid fa-plus"></i>
                    </button>
                </div>
            );
        }

        function InventoryView({ inventory, onAddStock }) {
            return (
                <div className="p-4 space-y-4">
                    <h2 className="text-2xl font-black text-[#431407]">Stock en Furgón</h2>
                    <p className="text-xs font-medium text-orange-800 bg-orange-50 p-3 rounded-xl border border-orange-100 leading-relaxed">
                        <i className="fa-solid fa-circle-info mr-1"></i> Este stock <b>baja automáticamente</b> cuando marcas un pedido como "Entregado" en la ruta.
                    </p>

                    <div className="grid grid-cols-2 gap-3">
                        {PRODUCTS.map(product => {
                            const stock = inventory[product.id] || 0;
                            const isLow = stock <= (product.type === 'caja' ? 2 : 5);

                            return (
                                <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                                    <div className="h-24 relative">
                                        <img src={product.img} alt={product.name} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 img-overlay flex items-end p-2">
                                            <h4 className="font-black text-white text-xs leading-tight drop-shadow-md">{product.name}</h4>
                                        </div>
                                    </div>
                                    <div className="p-3 flex-1 flex flex-col justify-between">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-xs font-bold text-gray-400 uppercase tracking-widest">Stock</span>
                                            <span className={`text-xl font-black ${isLow ? 'text-red-500' : 'text-green-600'}`}>
                                                {stock}
                                            </span>
                                        </div>
                                        <div className="flex gap-1 mt-auto">
                                            <button onClick={() => onAddStock(product.id, product.type === 'caja' ? 1 : 10)} className="flex-1 py-1.5 bg-gray-100 text-gray-700 font-black rounded-lg text-xs active:bg-gray-200">
                                                +{product.type === 'caja' ? '1' : '10'}
                                            </button>
                                            <button onClick={() => onAddStock(product.id, product.type === 'caja' ? 5 : 30)} className="flex-1 py-1.5 bg-orange-100 text-orange-700 font-black rounded-lg text-xs active:bg-orange-200">
                                                +{product.type === 'caja' ? '5' : '30'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function DashboardView({ orders }) {
            const stats = useMemo(() => {
                const todayLocal = getLocalYYYYMMDD();
                const todaysOrders = orders.filter(o => 
                    getLocalYYYYMMDD(o.createdAt) === todayLocal || 
                    (o.deliveredAt && getLocalYYYYMMDD(o.deliveredAt) === todayLocal)
                );
                
                const delivered = todaysOrders.filter(o => o.status === 'entregado');
                const pending = todaysOrders.filter(o => o.status === 'pendiente');
                const income = delivered.reduce((sum, o) => sum + o.total, 0);

                return { pending: pending.length, completed: delivered.length, income, latest: delivered.slice(0,4) };
            }, [orders]);

            return (
                <div className="p-4 space-y-4">
                    <h2 className="text-2xl font-black text-[#431407]">Resumen de Hoy</h2>
                    
                    <div className="bg-gradient-to-br from-orange-500 to-amber-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                        <i className="fa-solid fa-hand-holding-dollar absolute -right-4 -bottom-4 text-8xl opacity-10"></i>
                        <p className="font-bold text-orange-100 uppercase tracking-wider text-xs">Vendido Hoy</p>
                        <p className="text-5xl font-black mt-1">${stats.income.toLocaleString('es-CL')}</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center justify-center">
                            <span className="text-gray-400 font-bold uppercase text-xs tracking-wider">Por Entregar</span>
                            <span className="text-4xl font-black text-orange-500 mt-1">{stats.pending}</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col items-center justify-center">
                            <span className="text-gray-400 font-bold uppercase text-xs tracking-wider">Entregados</span>
                            <span className="text-4xl font-black text-green-500 mt-1">{stats.completed}</span>
                        </div>
                    </div>
                </div>
            );
        }

        function NewOrderModal({ onClose, onSave }) {
            const [customer, setCustomer] = useState('');
            const [address, setAddress] = useState('');
            const [phone, setPhone] = useState('');
            const [items, setItems] = useState({});

            const updateQty = (id, delta) => {
                setItems(prev => {
                    const current = prev[id] || 0;
                    const next = Math.max(0, current + delta);
                    if (next === 0) {
                        const copy = {...prev};
                        delete copy[id];
                        return copy;
                    }
                    return {...prev, [id]: next};
                });
            };

            const total = Object.entries(items).reduce((sum, [id, qty]) => {
                const p = PRODUCTS.find(x => x.id === id);
                return sum + (p ? p.price * qty : 0);
            }, 0);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!customer || !address || Object.keys(items).length === 0) {
                    alert("Falta ingresar cliente, dirección o productos.");
                    return;
                }
                const orderItems = Object.entries(items).map(([id, qty]) => ({id, qty}));
                onSave({ customerName: customer, address, phone, items: orderItems, total });
            };

            return (
                <div className="fixed inset-0 z-50 flex flex-col justify-end" style={{backgroundColor: 'rgba(0,0,0,0.6)'}}>
                    <div className="bg-[#FFF8F0] w-full max-w-[480px] mx-auto h-[92vh] rounded-t-3xl flex flex-col animate-slide-up shadow-2xl">
                        <div className="flex justify-between items-center p-4 bg-white rounded-t-3xl border-b border-gray-100">
                            <h3 className="text-xl font-black text-[#431407]">Ingresar Pedido</h3>
                            <button onClick={onClose} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 font-bold active:bg-gray-200">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 pb-10">
                            <form id="orderForm" onSubmit={handleSubmit} className="space-y-4">
                                <div className="space-y-3 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                    <h4 className="font-black text-gray-800 text-sm uppercase tracking-wide">Datos del Cliente</h4>
                                    <input required placeholder="Nombre o Local" value={customer} onChange={e=>setCustomer(e.target.value)}
                                        className="w-full p-3.5 rounded-xl border border-gray-200 font-bold text-gray-800 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all bg-gray-50" />
                                    <input required placeholder="Dirección de Entrega" value={address} onChange={e=>setAddress(e.target.value)}
                                        className="w-full p-3.5 rounded-xl border border-gray-200 font-bold text-gray-800 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all bg-gray-50" />
                                    <div className="relative">
                                        <span className="absolute left-4 top-3.5 text-gray-400 font-bold">+56 9</span>
                                        <input type="tel" placeholder="1234 5678" value={phone} onChange={e=>setPhone(e.target.value)}
                                            className="w-full p-3.5 pl-16 rounded-xl border border-gray-200 font-bold text-gray-800 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition-all bg-gray-50" />
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <h4 className="font-black text-gray-800 mb-3 text-sm uppercase tracking-wide ml-1">Agregar Productos</h4>
                                    <div className="space-y-2">
                                        {PRODUCTS.map(p => (
                                            <div key={p.id} className={`bg-white p-2.5 rounded-2xl shadow-sm border ${items[p.id] ? 'border-orange-400 bg-orange-50/30' : 'border-gray-100'} flex items-center justify-between transition-colors`}>
                                                <div className="flex items-center gap-3">
                                                    <img src={p.img} alt={p.name} className="w-12 h-12 rounded-xl object-cover" />
                                                    <div>
                                                        <p className="font-bold text-sm text-gray-800 leading-tight">{p.name}</p>
                                                        <p className="font-black text-orange-600 text-sm">${p.price.toLocaleString('es-CL')}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2 pr-1">
                                                    {items[p.id] ? (
                                                        <button type="button" onClick={()=>updateQty(p.id, -1)} className="w-9 h-9 bg-gray-200 rounded-full font-black text-gray-700 active:scale-90">-</button>
                                                    ) : <div className="w-9 h-9"></div>}
                                                    
                                                    <span className="font-black text-lg w-5 text-center">{items[p.id] || 0}</span>
                                                    
                                                    <button type="button" onClick={()=>updateQty(p.id, 1)} className="w-9 h-9 bg-orange-100 text-orange-600 rounded-full font-black active:scale-90">+</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </form>
                        </div>

                        <div className="bg-white p-4 border-t border-gray-100 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] pb-[env(safe-area-inset-bottom)]">
                            <div className="flex justify-between items-center mb-3 px-1">
                                <span className="font-bold text-gray-500 uppercase text-xs tracking-wider">Total Pedido</span>
                                <span className="font-black text-3xl text-[#431407]">${total.toLocaleString('es-CL')}</span>
                            </div>
                            <button type="submit" form="orderForm" className="w-full bg-orange-600 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center gap-2 active:bg-orange-700 transition-colors">
                                <i className="fa-solid fa-check"></i> Confirmar Pedido
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
